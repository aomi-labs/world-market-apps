[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "the-desk"
version = "0.1.0"
description = "The Desk — voice-first World Markets client on the Aomi rails"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "pyyaml>=6.0",
  "jellyfish>=1.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "websockets>=14.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
]
voice = [
  "livekit-agents[deepgram,cartesia,anthropic,silero]>=1.7.0",
  "anthropic>=0.40",
]

[project.scripts]
desk = "desk.cli:main"

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
only-include = ["desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["desk.cage", "desk.speech"]

[tool.coverage.report]
fail_under = 100
show_missing = true
