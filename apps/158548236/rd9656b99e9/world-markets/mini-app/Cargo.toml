[package]
name = "world-mini-app"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
world-markets = { path = ".." }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
rand = "0.8"
rust-embed = "8.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "io-util", "sync", "time"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2.1"
