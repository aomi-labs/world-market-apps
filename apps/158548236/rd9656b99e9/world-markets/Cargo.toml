[workspace]
members = ["mini-app"]
resolver = "2"

[package]
name = "world-markets"
version = "0.4.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
alloy-primitives = "=0.8.25"
alloy-sol-types = "=0.8.25"
aomi-sdk = "=4.0.0"
plotters = { version = "0.3.7", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "ab_glyph", "all_elements"] }
image = { version = "0.24", default-features = false, features = ["png"] }
png = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
base64 = "0.22"
rust_decimal = "1.37"
schemars = "1.0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
