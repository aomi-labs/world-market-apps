[package]
name = "world-markets"
version = "0.4.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Local aomi-run affordances (WORLD_ACCOUNT_ID account binding, dev owner
# reads). Never enabled in a hosted build.
local-dev = []

[dependencies]
alloy-primitives = "=0.8.25"
alloy-sol-types = "=0.8.25"
aomi-sdk = "=5.0.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rust_decimal = "1.37"
schemars = "1.0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
